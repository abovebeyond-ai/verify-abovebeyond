name: verify

# Checks the evidence Above Beyond publishes about its agent, with public inputs only and
# no credential of theirs. Fork this repository and switch Actions on: from then on your
# account, on GitHub's machines, records a verification Above Beyond cannot touch. That is
# what row 8.1.5 of the Proof-of-Control draft asks for: a recorded run by a party outside
# the operator. Run by Above Beyond itself, it is a daily public run on GitHub's
# infrastructure and nothing more; the conformance statement says so.

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTROL_TAG: v0.29.0
      DID_LOG: https://abovebeyond.ai/.well-known/did.jsonl
      DID_DOC: https://abovebeyond.ai/.well-known/did.json
      HEDERA_TOPIC: 0.0.10856156
      HEDERA_NETWORK: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # The evidence, the tooling, the key: three public places, none of them this repository.
      - run: git clone --depth 1 https://github.com/abovebeyond-ai/control-evidence.git evidence
      - run: git clone --depth 1 --branch "$CONTROL_TAG" https://github.com/abovebeyond-ai/control.git control
      # The keys come from the identity log itself (control v0.16.3): every key the
      # gateway ever had, so a rebuilt machine with a new key leaves its predecessor's
      # chains verifiable, and the current one for the attestation. The verdict names the
      # current one, read the same way, for the record.
      - name: The gateway's current key, for the record
        run: |
          KEY=$(curl -fsS "$DID_DOC" | python3 -c '
          import sys, json, base64
          doc = json.load(sys.stdin)
          for m in doc["verificationMethod"]:
              if m["id"].endswith("#control-gateway"):
                  x = m["publicKeyJwk"]["x"]
                  print(base64.urlsafe_b64decode(x + "=" * (-len(x) % 4)).hex())')
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          echo "gateway key from the identity log: $KEY"

      # The toolchain and the modules first, so their download notices stay out of the verdict.
      - name: Fetch the checker's dependencies
        working-directory: control
        run: go mod download && go build ./cmd/verify ./cmd/anchor

      # The release the machine runs is read from its records; the checker fetches that
      # asset, holds it to the sha256 the records name and RTMR3 to its SHA-384 (v0.16.4).
      #
      # The checker's own tag above is not the reference, but it does have to be able to
      # read what the machine writes, and that is not the same thing. Pinned at v0.16.4 it
      # could not: from 14 to 19 September 2026 this watch published "broken" every day on
      # the one line "the measured binary is not the release asset", while the same check
      # under v0.29.0 held, with 35 holds and no break. Six days of a public verdict that
      # said the evidence was bad when the checker was simply too old to read it. So this
      # tag moves with the gateway's releases: when control is tagged, raise it here too.
      - name: The chains, the workings, the attestation and its layers, the anchors
        id: chains
        working-directory: control
        run: |
          set +e
          go run ./cmd/verify --store ../evidence/store --did-log "$DID_LOG" --anchors ../evidence/anchors --attestation ../evidence/store/attestation.json 2>&1 | grep -Ev '^(WARN|go: )' | tee ../chains.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: The identity log against the public ledger
        id: identity
        working-directory: control
        run: |
          set +e
          printf '{"network":"%s","topicId":"%s"}\n' "$HEDERA_NETWORK" "$HEDERA_TOPIC" > ../ledger.json
          go run ./cmd/anchor identity check --log "$DID_LOG" --out ../evidence/anchors --hedera ../ledger.json 2>&1 | grep -Ev '^(WARN|go: )' | tee ../identity.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The record: what was checked, by which tooling, with which key, and the verdict, in
      # this repository under the account that ran it. Yours, if you forked.
      - name: Record the verdict
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VERDICT=holds
          if [ "${{ steps.chains.outputs.exit }}" != "0" ] || [ "${{ steps.identity.outputs.exit }}" != "0" ]; then VERDICT=broken; fi
          {
            echo "# $VERDICT, $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Run by \`${{ github.repository_owner }}\` on GitHub's runner, run id ${{ github.run_id }}, with control $CONTROL_TAG, the evidence at \`$(git -C evidence rev-parse --short HEAD)\`, the gateway key \`$KEY\` from $DID_DOC."
            echo
            echo '## The chains'; echo; echo '```'; cat chains.txt; echo '```'
            echo
            echo '## The identity log'; echo; echo '```'; cat identity.txt; echo '```'
          } > "verdicts/$DATE.md"
          cp "verdicts/$DATE.md" "$GITHUB_STEP_SUMMARY"
          git config user.name "verify"
          git config user.email "verify@users.noreply.github.com"
          git add verdicts
          git commit -qm "$VERDICT $DATE" || echo "no change to record"
          git push
          [ "$VERDICT" = holds ]
